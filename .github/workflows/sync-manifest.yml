name: Sync combined manifest

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

# Runs queue instead of overlapping: a run that started before another one pushed would commit the
# same manifest on a stale checkout and have its push rejected (run 55, 2026-10-19).
concurrency:
  group: sync-manifest
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild the combined manifest
        run: python scripts/merge_manifests.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: refresh the combined plugin manifest"
          git push
